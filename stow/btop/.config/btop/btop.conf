# Graphite / Gruvbox: orange focus, gold memory/network, purple processes.
color_theme = "graphite"
theme_background = true
truecolor = true
rounded_corners = true
terminal_sync = true
graph_symbol = "braille"
update_ms = 2000

# Start compact: adding both GPU detail panels requires more than 30 rows.
# GPU0/GPU1 utilization remains in the CPU box when supported.
shown_boxes = "cpu mem net proc"
show_gpu_info = "Auto"
# p / Shift+p: compact overview, GPU0 only, GPU1 only. GPU views show model names.
# Keep GPU views separate from CPU/process panels so they fit short terminals.
presets = "cpu:0:default,mem:0:default,net:0:default,proc:0:default gpu0:0:default gpu1:0:default"

proc_sorting = "cpu lazy"
proc_mem_bytes = true
proc_gradient = true
proc_tree = false
vim_keys = true
check_temp = true
show_cpu_freq = true
clock_format = "%H:%M"
background_update = false
net_auto = true
net_sync = true
show_battery = true

# Persist deliberate changes in Git, rather than rewriting this config on exit.
save_config_on_exit = false
