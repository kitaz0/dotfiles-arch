general {
    lock_cmd = ~/.local/lib/graphite/lock.sh
    before_sleep_cmd = ~/.local/lib/graphite/lock.sh
    after_sleep_cmd = ~/.local/lib/graphite/resume.sh
    inhibit_sleep = 3
}
listener {
    timeout = 300
    on-timeout = ~/.local/lib/graphite/lock.sh
}
listener {
    timeout = 420
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
# No automatic suspend: lid policy remains with logind and existing power manager.
