general {
    hide_cursor = true
}
background {
    monitor =
    color = rgba(282828ff)
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ebdbb2ff)
    font_size = 64
    font_family = Noto Sans
    position = 0, 120
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 54
    outline_thickness = 2
    outer_color = rgba(665c54ff)
    inner_color = rgba(3c3836ff)
    font_color = rgba(ebdbb2ff)
    check_color = rgba(b8bb26ff)
    fail_color = rgba(fb4934ff)
    placeholder_text = <i>Password</i>
    rounding = 7
    position = 0, -40
    halign = center
    valign = center
}
